name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python -m json.tool schemas/table-definitions.json >/dev/null
      - run: python -m json.tool examples/first-calibrated-sample.json >/dev/null
